name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 'lts/*'
          cache: 'npm'
      - run: npm ci
      - run: npm run build

  quality:
    name: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 'lts/*'
          cache: 'npm'
      - run: npm ci
      - run: npx eslint src/assets/js .eleventy.js scripts eslint.config.js
      - run: npx stylelint "src/assets/css/**/*.css"
      - run: npm run build
      - run: npx html-validate "_site/**/*.html"
      - run: npx linkinator _site --recurse --retry --retry-errors --skip "https://www.linkedin.com/*" --skip "^https://markusluisflores.github.io/"
      # This repo has no runtime `dependencies` (static site, nothing ships to
      # production) - --omit=dev scopes the audit to that reality instead of
      # failing CI on build-tooling-only advisories with no user exposure.
      # Assumption this relies on: any package whose code actually ends up in
      # the built site (e.g. bundled client-side JS) must be listed under
      # `dependencies`, not `devDependencies`, to stay covered by this check.
      - run: npm audit --audit-level=high --omit=dev

  lighthouse:
    name: lighthouse
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 'lts/*'
          cache: 'npm'
      - run: npm ci
      - run: npm run build
      - run: npx @lhci/cli autorun
